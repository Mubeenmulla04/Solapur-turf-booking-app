# ── Test Configuration ─────────────────────────────────────────────────────
# Uses H2 in-memory database — no external PostgreSQL needed for tests

# Datasource - H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT - test values
JWT_SECRET=test-secret-key-for-unit-tests-only-not-for-production-use-ever-64chars
JWT_EXPIRATION=86400000
JWT_REFRESH_EXPIRATION=604800000

# Razorpay - test/dummy values
RAZORPAY_KEY_ID=rzp_test_dummy
RAZORPAY_KEY_SECRET=dummy_secret

# Email - disabled in tests
spring.mail.host=localhost
spring.mail.port=25
SPRING_MAIL_USERNAME=test@test.com
SPRING_MAIL_PASSWORD=test

# CORS
ALLOWED_ORIGINS=http://localhost:3000

# Firebase - skip in tests
firebase.config.path=
firebase.config.json={}

# Google Drive - skip in tests
google.drive.config.path=
google.drive.folder.id=test-folder

# Disable environment validator in tests
spring.profiles.active=test
