# Spring Application
spring.application.name=solapur-turf-backend
server.port=${SERVER_PORT:8080}

# Database Configuration (Overrides via Environment Variables on Render)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/turf_booking_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=15000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jackson
spring.jackson.default-property-inclusion=non_null

# JWT Configuration
jwt.secret=${JWT_SECRET:solapur-turf-booking-app-secure-jwt-secret-key-256-bits!}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}

# CORS Configuration
spring.web.cors.allowed-origins=${ALLOWED_ORIGINS:*}
spring.web.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Logging
logging.level.com.solapur.turf=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=WARN
logging.level.root=${LOG_LEVEL_SPRING:INFO}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Email Configuration - REQUIRED: Set SPRING_MAIL_USERNAME and SPRING_MAIL_PASSWORD
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:mullamubeen839@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:Mubeen@coders123}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}

# Firebase Configuration
firebase.config.path=${FIREBASE_CONFIG_PATH:firebase-service-account.json}
firebase.config.json=${FIREBASE_CONFIG_JSON:}

# Google Drive Backup Configuration
google.drive.config.path=${GOOGLE_DRIVE_CONFIG_PATH:google-drive-service-account.json}
google.drive.folder.id=${GOOGLE_DRIVE_FOLDER_ID:1T8OSOIGqxFhQj6XftOUBw_mW22tzc_OU}

# Multipart Upload Settings (increased to 10MB per file, 50MB per request)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

